name: Deploy Edge Function

# ফোন থেকে চালানো যাবে: GitHub → Actions → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set function secrets
        run: |
          curl -s -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg fpid "${{ secrets.FIREBASE_PROJECT_ID }}" \
              --arg srk "${{ secrets.SERVICE_ROLE_KEY }}" \
              '[{name:"FIREBASE_PROJECT_ID",value:$fpid},{name:"SERVICE_ROLE_KEY",value:$srk}]')"
          echo "✅ secrets set"

      - name: Deploy firebase-otp function
        run: supabase functions deploy firebase-otp --project-ref "$PROJECT_REF" --no-verify-jwt
