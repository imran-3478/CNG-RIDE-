name: Build CNG RIDE APK

# Manual trigger only: Actions tab -> "Build CNG RIDE APK" -> "Run workflow".
# (No longer runs on every push, so normal website uploads stay green.)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip Flutter source
        run: |
          unzip -o cng_ride_flutter.zip
          ls cng_ride_flutter

      - name: Remove stale local.properties (safety)
        run: rm -f cng_ride_flutter/android/local.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: cng_ride_flutter
        run: flutter pub get

      - name: Build Debug APK
        working-directory: cng_ride_flutter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNG-RIDE-APK
          path: cng_ride_flutter/build/app/outputs/flutter-apk/app-debug.apk
